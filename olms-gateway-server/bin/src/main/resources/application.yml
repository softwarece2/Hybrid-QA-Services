spring:
  application:
    name: olms-gateway-server
  main:
    web-application-type: reactive
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        corsConfigurations:
          '[/**]':
              allowedOrigins: "*"
              allowedMethods: "*"
              allowedHeaders: "*"
server:
  port: 8766
eureka:
  client:
    service-url:
    #  default-zone: http://localhost:8762/eureka
#      default-zone: http://13.235.29.42:8761/eureka
      defaultZone: ${EUREKA_URI:http://localhost:8762/eureka}
wiqas:
  jwt:
    secret: sj^*d29!*u@b^e
    expirationMs: 28800000
authurl: http://localhost:8087/user/validateToken    